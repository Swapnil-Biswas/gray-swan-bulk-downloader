<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="12" fill="#f6f8fa"/>
  <!-- Step 1 -->
  <g transform="translate(20,20)">
    <rect width="290" height="290" rx="10" fill="#fff" stroke="#d0d7de"/>
    <circle cx="28" cy="28" r="15" fill="#1f6feb"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">1</text>
    <text x="52" y="33" font-size="15" font-weight="600" fill="#1f2328">Open the extensions page</text>
    <rect x="18" y="62" width="254" height="34" rx="17" fill="#eef1f4" stroke="#d0d7de"/>
    <circle cx="38" cy="79" r="6" fill="none" stroke="#57606a" stroke-width="2"/>
    <text x="52" y="84" font-size="14" fill="#1f2328" font-family="Consolas, monospace">chrome://extensions</text>
    <text x="18" y="132" font-size="13" fill="#57606a">Type this in the address bar</text>
    <text x="18" y="150" font-size="13" fill="#57606a">and press Enter.</text>
    <text x="18" y="190" font-size="13" fill="#57606a">Or: ⋮ menu → Extensions →</text>
    <text x="18" y="208" font-size="13" fill="#57606a">Manage Extensions.</text>
  </g>
  <!-- Step 2 -->
  <g transform="translate(335,20)">
    <rect width="290" height="290" rx="10" fill="#fff" stroke="#d0d7de"/>
    <circle cx="28" cy="28" r="15" fill="#1f6feb"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">2</text>
    <text x="52" y="33" font-size="15" font-weight="600" fill="#1f2328">Turn on Developer mode</text>
    <rect x="18" y="62" width="254" height="44" rx="6" fill="#eef1f4"/>
    <text x="30" y="89" font-size="14" fill="#1f2328">Developer mode</text>
    <rect x="200" y="72" width="46" height="24" rx="12" fill="#1f6feb"/>
    <circle cx="234" cy="84" r="9" fill="#fff"/>
    <rect x="190" y="64" width="66" height="40" rx="10" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="18" y="142" font-size="13" fill="#57606a">The switch is in the top-right</text>
    <text x="18" y="160" font-size="13" fill="#57606a">corner of the page.</text>
    <text x="18" y="200" font-size="13" fill="#57606a">A new toolbar appears with</text>
    <text x="18" y="218" font-size="13" fill="#57606a">“Load unpacked”.</text>
  </g>
  <!-- Step 3 -->
  <g transform="translate(650,20)">
    <rect width="290" height="290" rx="10" fill="#fff" stroke="#d0d7de"/>
    <circle cx="28" cy="28" r="15" fill="#1f6feb"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">3</text>
    <text x="52" y="33" font-size="15" font-weight="600" fill="#1f2328">Load the extension folder</text>
    <rect x="18" y="64" width="120" height="34" rx="6" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="78" y="86" text-anchor="middle" font-size="13" fill="#1f6feb" font-weight="600">Load unpacked</text>
    <rect x="12" y="58" width="132" height="46" rx="9" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="5 3"/>
    <rect x="18" y="122" width="254" height="78" rx="6" fill="#eef1f4"/>
    <text x="30" y="146" font-size="13" fill="#1f2328">📁 gray-swan-bulk-downloader</text>
    <rect x="40" y="157" width="140" height="26" rx="4" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="50" y="175" font-size="13" fill="#0969da" font-weight="600">📁 extension</text>
    <text x="18" y="232" font-size="13" fill="#57606a">Pick the <tspan font-weight="700" fill="#1f2328">extension</tspan> folder (the one</text>
    <text x="18" y="250" font-size="13" fill="#57606a">with manifest.json), then reload</text>
    <text x="18" y="268" font-size="13" fill="#57606a">your Arena tab.</text>
  </g>
</svg>
