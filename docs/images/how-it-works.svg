<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="960" height="300" rx="12" fill="#f6f8fa"/>
  <!-- browser frame -->
  <rect x="20" y="20" width="620" height="260" rx="10" fill="#fff" stroke="#d0d7de"/>
  <text x="36" y="44" font-size="13" fill="#57606a">Your Chrome tab, logged in to app.grayswan.ai</text>

  <rect x="40" y="64" width="170" height="90" rx="8" fill="#17191a"/>
  <text x="125" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#d7ff3a">⬇ BULK EXPORT</text>
  <text x="125" y="118" text-anchor="middle" font-size="12" fill="#c9cdd0">range · format · split</text>
  <text x="125" y="136" text-anchor="middle" font-size="12" fill="#c9cdd0">(extension panel)</text>

  <rect x="260" y="64" width="360" height="190" rx="8" fill="#eef1f4" stroke="#d0d7de"/>
  <text x="276" y="88" font-size="13" font-weight="600" fill="#1f2328">Arena's own endpoints (same as the Chats modal)</text>
  <text x="276" y="114" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">/panels/chats?page=N&amp;limit=50</text>
  <text x="276" y="136" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">/panels/submissions?page=N</text>
  <text x="276" y="158" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">/panels/batches</text>
  <text x="276" y="180" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">/__data.json?batchGroupId=…</text>
  <text x="276" y="202" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">/__data.json?chatId=…</text>
  <text x="276" y="232" font-size="12" fill="#57606a">Your session cookie → only your own data</text>

  <path d="M210 100 H255" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M255 125 H215" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="176" width="170" height="78" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="125" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Build files in page</text>
  <text x="125" y="222" text-anchor="middle" font-size="12" fill="#57606a">JSON / CSV → deflate</text>
  <text x="125" y="240" text-anchor="middle" font-size="12" fill="#57606a">→ one .zip</text>
  <path d="M125 154 V172" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- output -->
  <path d="M210 215 C 420 290, 600 290, 690 200" stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="680" y="60" width="260" height="194" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="700" y="88" font-size="14" font-weight="700" fill="#1f2328">📦 grayswan_&lt;challenge&gt;.zip</text>
  <text x="700" y="114" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">manifest.json</text>
  <text x="700" y="136" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">chats.json / .csv</text>
  <text x="700" y="158" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">submissions.json / .csv</text>
  <text x="700" y="180" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">batches.json / .csv</text>
  <text x="700" y="202" font-size="12.5" fill="#1f2328" font-family="Consolas, monospace">batches_summary.csv</text>
  <text x="700" y="234" font-size="12" fill="#57606a">Saved to your Downloads folder</text>
</svg>
