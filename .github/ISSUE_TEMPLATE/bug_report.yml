name: Bug report
description: Something didn't work while exporting
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't paste exported chats, cookies or account details.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log text
      description: Copy the text from the log box at the bottom of the Bulk Export panel.
      render: text
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: What you selected
      description: Sections (chats / submissions / batches), ranges, format, split, speed settings.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 131 on Windows 11
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the extension's card in chrome://extensions
      placeholder: e.g. 1.0.0
